[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxide"
version = "2.0.0"
description = "A comprehensive Rust-inspired type system and utility library for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "matkecn"},
]
keywords = ["rust", "oxide", "option", "result", "types", "utility", "concurrency"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/matkecn/oxide"
Repository = "https://github.com/matkecn/oxide"

[tool.setuptools.packages.find]
include = ["oxide", "oxide.*"]
